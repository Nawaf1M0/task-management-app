
changelog:
  exclude:
    labels:
      - skip-changelog

  categories:
    - title: New Features
      labels:
        - enhancement
        - feature

    - title: Bug Fixes
      labels:
        - bug
        - fix

    - title: Security Improvements
      labels:
        - security
        - dependencies

    - title: CI/CD and Infrastructure
      labels:
        - ci
        - infrastructure

    - title: Documentation
      labels:
        - documentation

    - title: Other Changes
      labels:
        - "*"
