
name: Setup JavaScript
description: Configure Node.js and validate JavaScript syntax

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: '24'

runs:
  using: composite

  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Check JavaScript syntax
      shell: bash
      run: |
        node --check app.js
        node --check task-utils.js
