
name: Automated Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release version
        id: version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Validated release version: $VERSION"

      - name: Verify tagged commit belongs to main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Tagged commit does not belong to main history."
            exit 1
          fi

          echo "Tagged commit belongs to main history."

  build:
    name: Build Release Package
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Prepare JavaScript environment
        uses: ./.github/actions/setup-javascript
        with:
          node-version: '24'

      - name: Run automated tests
        run: node --test


      - name: Create release package
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mkdir -p release

          FILES=(
            index.html
            styles.css
            app.js
            task-utils.js
          )

          for file in "${FILES[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required application file missing: $file"
              exit 1
            fi

            echo "Verified required file: $file"
          done

          zip "release/task-management-app-${VERSION}.zip" \
            "${FILES[@]}"


      - name: Validate release package contents
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          PACKAGE="release/task-management-app-${VERSION}.zip"

          unzip -t "$PACKAGE"

          EXPECTED_FILES=$(printf '%s\n' \
            index.html \
            styles.css \
            app.js \
            task-utils.js | sort)

          ACTUAL_FILES=$(unzip -Z1 "$PACKAGE" | sort)

          if [[ "$ACTUAL_FILES" != "$EXPECTED_FILES" ]]; then
            echo "::error::Release package contents are incorrect."
            echo "Expected files:"
            echo "$EXPECTED_FILES"
            echo "Actual files:"
            echo "$ACTUAL_FILES"
            exit 1
          fi

          echo "Release package completeness verification PASSED"

      - name: Generate and verify SHA-256 checksum
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cd release

          sha256sum "task-management-app-${VERSION}.zip" \
            > SHA256SUMS.txt

          sha256sum -c SHA256SUMS.txt

      - name: Upload release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-package
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs:
      - validate
      - build

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Download release package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-package
          path: release

      - name: Verify release checksum
        run: |
          cd release
          sha256sum -c SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          gh release create "$VERSION" \
            "release/task-management-app-${VERSION}.zip" \
            "release/SHA256SUMS.txt" \
            --title "$VERSION" \
            --verify-tag \
            --generate-notes
