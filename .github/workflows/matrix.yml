
name: JavaScript Compatibility Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Compatibility (${{ matrix.os }}, Node ${{ matrix.node-version }})

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node-version:
          - '22'
          - '24'

    uses: ./.github/workflows/reusable-tests.yml

    with:
      operating-system: ${{ matrix.os }}
      node-version: ${{ matrix.node-version }}

  quality-gate:
    name: Compatibility Quality Gate
    needs: compatibility
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate compatibility results
        env:
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
        run: |
          echo "Compatibility result: $COMPATIBILITY_RESULT"

          if [ "$COMPATIBILITY_RESULT" != "success" ]; then
            echo "Compatibility quality gate failed"
            exit 1
          fi

          echo "Compatibility quality gate passed"
