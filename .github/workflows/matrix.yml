
name: JavaScript Compatibility Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Compatibility (${{ matrix.os }}, Node ${{ matrix.node-version }})

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node-version:
          - '22'
          - '24'

    uses: ./.github/workflows/reusable-tests.yml

    with:
      operating-system: ${{ matrix.os }}
      node-version: ${{ matrix.node-version }}
