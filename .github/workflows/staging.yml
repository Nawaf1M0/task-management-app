
name: Staging Environment Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-demo:
    name: Inspect Staging Environment
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Display environment configuration
        env:
          APP_ENVIRONMENT: ${{ vars.APP_ENVIRONMENT }}
        run: |
          echo "Environment: $APP_ENVIRONMENT"
          echo "GitHub ref: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"

      - name: Verify deployment secret exists
        env:
          DEPLOY_TOKEN: ${{ secrets.DEMO_DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "Deployment token is missing"
            exit 1
          fi

          echo "Deployment token is configured"
