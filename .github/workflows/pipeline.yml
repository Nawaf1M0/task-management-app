
name: Application Build Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pipeline Tests
    uses: ./.github/workflows/reusable-tests.yml
    with:
      operating-system: ubuntu-latest
      node-version: '24'

  build:
    name: Build Application
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Prepare application files
        run: |
          mkdir -p dist
          cp index.html styles.css app.js task-utils.js dist/

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/styles.css
          test -f dist/app.js
          test -f dist/task-utils.js
          ls -la dist/

      - name: Upload build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: application-build
          path: dist/
          retention-days: 14
          if-no-files-found: error

  package:
    name: Package Application
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: application-build
          path: dist/

      - name: Create application archive
        run: |
          cd dist
          zip -r ../task-management-app.zip .

      - name: Upload application package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: application-package
          path: task-management-app.zip
          retention-days: 14
          if-no-files-found: error
  quality-gate:
    name: Pipeline Quality Gate
    needs: [test, build, package]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate pipeline results
        env:
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          echo "Test result: $TEST_RESULT"
          echo "Build result: $BUILD_RESULT"
          echo "Package result: $PACKAGE_RESULT"

          if [ "$TEST_RESULT" != "success" ] ||
             [ "$BUILD_RESULT" != "success" ] ||
             [ "$PACKAGE_RESULT" != "success" ]; then
            echo "Pipeline quality gate failed"
            exit 1
          fi

          echo "Pipeline quality gate passed"
